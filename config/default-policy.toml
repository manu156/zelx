# Reference for the system allowlist compiled into Phase 1; not loaded at runtime.

[[rules]]
app_id = "*"
resource = "filesystem"
target_glob = "/usr"
decision = "ALLOW"
scope = "ALWAYS"

[[rules]]
app_id = "*"
resource = "filesystem"
target_glob = "/usr/**"
