[package]
name = "zelx"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Linux filesystem audit and runtime permissions"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
libc = "0.2.189"
lru = "0.16.3"
rusqlite = "0.35.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.3.18"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
